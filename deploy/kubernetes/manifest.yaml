
# ============================================================
# CORVIAN - EKS KUBERNETES DEPLOYMENT
# Namespace: corvian
# ============================================================

apiVersion: v1
kind: Namespace
metadata:
  name: corvian

---
# ============================================================
# Application configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: corvian-config
  namespace: corvian
data:
  REDIS_SERVERA: "redis://redis-a:6379"
  REDIS_SERVER1: "redis://redis-a:6379"
  REDIS_SERVERB: "redis://redis-b:6379"
  REDIS_SERVERC: "redis://redis-c:6379"

  PORT: "5000"

  MARKET_MAKER_SYMBOLS: "BTC/USDT:67000:0.1,ETH/USDT:2470:0.01,SOL/USDT:162:0.01"
  MARKET_MAKER_ORDERS_PER_SIDE: "10000"
  MARKET_MAKER_FLOW_SOURCE: "binance"
  MARKET_MAKER_MIN_SPREAD_TICKS: "1"
  MARKET_MAKER_QUOTE_SCALE_BPS: "10"
  MARKET_MAKER_MIN_ORDER_NOTIONAL: "100"
  MARKET_MAKER_MAX_ORDER_NOTIONAL: "2000"
  MARKET_MAKER_MIN_TRADE_NOTIONAL: "5000"
  MARKET_MAKER_MAX_TRADE_NOTIONAL: "30000"
  MARKET_MAKER_REPRICE_INTERVAL_MS: "2000"
  MARKET_MAKER_REPRICE_FRACTION: "0.05"
  MARKET_MAKER_TRADE_INTERVAL_MS: "250"

---
# ============================================================
# REDIS A
# Order queue and order-status pub/sub
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-a
  namespace: corvian
spec:
  serviceName: redis-a
  replicas: 1
  selector:
    matchLabels:
      app: redis-a
  template:
    metadata:
      labels:
        app: redis-a
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --save
            - ""
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-a
  namespace: corvian
spec:
  selector:
    app: redis-a
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
# ============================================================
# REDIS B
# Market data pub/sub and candle history
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-b
  namespace: corvian
spec:
