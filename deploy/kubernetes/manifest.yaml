---
apiVersion: v1
kind: Service
metadata:
  name: redis-c
  namespace: corvian
spec:
  selector:
    app: redis-c
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
# ============================================================
# DATABASE MIGRATION
# One-shot job
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: corvian-migrate
  namespace: corvian
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: corvian-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: 646519967137.dkr.ecr.ap-southeast-2.amazonaws.com/myprojects/corvian:migrate-latest
          imagePullPolicy: Always
          workingDir: /app/packages/database
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corvian-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: db-ca
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: db-ca
          secret:
            secretName: corvian-db-ca

---
# ============================================================
# ENGINE
# Single replica: orderbooks are in memory
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: corvian
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
        - name: engine
          image: 646519967137.dkr.ecr.ap-southeast-2.amazonaws.com/myprojects/corvian:engine-latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: corvian-config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
# ============================================================
# DATABASE PROCESSOR
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-processor
  namespace: corvian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database-processor
  template:
    metadata:
      labels:
        app: database-processor
    spec:
      containers:
        - name: processor
          image: 646519967137.dkr.ecr.ap-southeast-2.amazonaws.com/myprojects/corvian:database-processor-latest
          imagePullPolicy: Always
          command: ["node", "/app/database-processor.mjs"]
          workingDir: /app/apps/database-processor
          envFrom:
            - configMapRef:
                name: corvian-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corvian-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: db-ca
              mountPath: /app/certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: db-ca
          secret:
            secretName: corvian-db-ca

---
# ============================================================
# MARKET MAKER
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-maker
  namespace: corvian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: market-maker
  template:
    metadata:
      labels:
        app: market-maker
    spec:
      containers:
        - name: market-maker
          image: 646519967137.dkr.ecr.ap-southeast-2.amazonaws.com/myprojects/corvian:market-maker-latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: corvian-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
# ============================================================
# WEB APPLICATION
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: corvian
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: 646519967137.dkr.ecr.ap-southeast-2.amazonaws.com/myprojects/corvian:web-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: corvian-config
          env:
            - name: PORT
              value: "3000"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: corvian-secrets
                  key: AUTH_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corvian-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: db-ca
              mountPath: /app/certs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: db-ca
          secret:
            secretName: corvian-db-ca

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: corvian
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000

---
# ============================================================
# WEBSOCKET SERVER
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-server
  namespace: corvian
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-server
  template:
    metadata:
      labels:
        app: ws-server
    spec:
      containers:
        - name: ws-server
          image: 646519967137.dkr.ecr.ap-southeast-2.amazonaws.com/myprojects/corvian:ws-server-latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: corvian-config
          ports:
            - name: websocket
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ws-server
  namespace: corvian
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: ws-server
  ports:
    - name: websocket
      port: 80
      targetPort: 5000
