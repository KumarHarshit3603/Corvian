
name: corvian

# ------------------------------------------------------------
# Shared Redis configuration
# ------------------------------------------------------------
x-redis: &redis
  image: redis:7-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10
  networks:
    - backend

# ------------------------------------------------------------
# Shared Node application configuration
# ------------------------------------------------------------
x-node: &node
  restart: unless-stopped
  init: true
  networks:
    - backend

# ------------------------------------------------------------
# Redis services
# ------------------------------------------------------------
services:

  redis-a:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-a-data:/data

  redis-b:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-b-data:/data

  redis-c:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redis-c-data:/data

# ------------------------------------------------------------
# Database migration
# ------------------------------------------------------------
  migrate:
    image: ${REGISTRY:-646519967137.dkr.ecr.ap-southeast-2.amazonaws.com}/myprojects/corvian:migrate-${TAG:-latest}
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    volumes:
      - ./certs/ca.pem:/app/certs/ca.pem:ro
    restart: "no"
    networks:
      - backend

# ------------------------------------------------------------
# Matching engine
# ------------------------------------------------------------
  engine:
    <<: *node
    image: ${REGISTRY:-646519967137.dkr.ecr.ap-southeast-2.amazonaws.com}/myprojects/corvian:engine-${TAG:-latest}
    build:
      context: .
      target: engine
    environment:
      REDIS_SERVERA: redis://redis-a:6379
      REDIS_SERVERB: redis://redis-b:6379
      REDIS_SERVERC: redis://redis-c:6379
    depends_on:
      redis-a:
        condition: service_healthy
      redis-b:
        condition: service_healthy
      redis-c:
        condition: service_healthy

# ------------------------------------------------------------
# WebSocket server
# ------------------------------------------------------------
  ws-server:
    <<: *node
    image: ${REGISTRY:-646519967137.dkr.ecr.ap-southeast-2.amazonaws.com}/myprojects/corvian:ws-server-${TAG:-latest}
    build:
      context: .
      target: ws-server
    environment:
      PORT: "5000"
      REDIS_SERVERB: redis://redis-b:6379
    ports:
      - "5000:5000"
    depends_on:
      redis-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

# ------------------------------------------------------------
# Database processor
# ------------------------------------------------------------
  database-processor:
    <<: *node
    image: ${REGISTRY:-646519967137.dkr.ecr.ap-southeast-2.amazonaws.com}/myprojects/corvian:database-processor-${TAG:-latest}
    build:
      context: .
      target: database-processor
    working_dir: /app/apps/database-processor
    command: ["node", "/app/database-processor.mjs"]
    environment:
      REDIS_SERVERC: redis://redis-c:6379
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
    volumes:
      - ./certs/ca.pem:/app/certs/ca.pem:ro
    depends_on:
      redis-c:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

# ------------------------------------------------------------
# Market maker
# ------------------------------------------------------------
  market-maker:
    <<: *node
    image: ${REGISTRY:-646519967137.dkr.ecr.ap-southeast-2.amazonaws.com}/myprojects/corvian:market-maker-${TAG:-latest}
    build:
      context: .
      target: market-maker
    environment:
      REDIS_SERVERA: redis://redis-a:6379
      REDIS_SERVERB: redis://redis-b:6379
      REDIS_SERVERC: redis://redis-c:6379
    depends_on:
      redis-a:
        condition: service_healthy
      redis-b:
        condition: service_healthy
      redis-c:
        condition: service_healthy

# ------------------------------------------------------------
# Next.js web application
# ------------------------------------------------------------
  web:
    <<: *node
    image: ${REGISTRY:-646519967137.dkr.ecr.ap-southeast-2.amazonaws.com}/myprojects/corvian:web-${TAG:-latest}
    build:
      context: .
      target: web
    args:
    NEXT_PUBLIC_MARKET_WS_URL: ${NEXT_PUBLIC_MARKET_WS_URL}
    environment:
      PORT: "3000"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_SERVER1: redis://redis-a:6379
      REDIS_SERVERA: redis://redis-a:6379
    volumes:
      - ./certs/ca.pem:/app/certs/ca.pem:ro
    ports:
      - "3000:3000"
    depends_on:
      redis-a:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

# ------------------------------------------------------------
# Networks and persistent volumes
# ------------------------------------------------------------
networks:
  backend:

volumes:
  redis-a-data:
  redis-b-data:
  redis-c-data:
