
services:
  redis1:
    image: redis:latest
    container_name: redis1
    ports:
      - "6379:6379"
    volumes:
      - redis1_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  redis2:
    image: redis:latest
    container_name: redis2
    ports:
      - "6380:6379"
    volumes:
      - redis2_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  redis3:
    image: redis:latest
    container_name: redis3
    ports:
      - "6381:6379"
    volumes:
      - redis3_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis1_data:
  redis2_data:
  redis3_data:
